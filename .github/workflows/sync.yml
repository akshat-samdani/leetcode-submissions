name: Sync LeetCode submissions

on:
  schedule:
    # 18:30 UTC = 00:00 IST
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-submission-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export accepted submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: python sync.py

      - name: Commit exported submissions
        run: |
          if git diff --quiet; then
            echo "No new accepted submissions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solutions synced_submissions.json
          git commit -m "Sync accepted LeetCode submissions"
          git push
